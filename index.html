<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MaterialLab Metales</title>

<style>
body{
 font-family: Arial;
 background:#f4f7fb;
 text-align:center;
 padding:20px;
}
.container{
 background:white;
 padding:20px;
 border-radius:15px;
 max-width:700px;
 margin:auto;
 box-shadow:0 10px 20px rgba(0,0,0,0.1);
}
button{
 padding:10px 15px;
 margin:5px;
 background:#2457c5;
 color:white;
 border:none;
 border-radius:8px;
 cursor:pointer;
}
button.good{background:#0e8f7e;}
textarea{width:95%;height:120px;margin:10px;}
input{width:95%;padding:8px;margin:5px;}
</style>

</head>

<body>

<div class="container">

<h1>MaterialLab Metales</h1>

<h3>Identificación</h3>

<input id="nombre" placeholder="Nombre o alias">
<input id="grupo" placeholder="Grupo">

<p><strong>RGPD:</strong> Se utilizan alias. No se recogen datos personales sensibles.
Los datos se usan con fines educativos y se gestionan en Microsoft 365.</p>

<h3>Material elegido</h3>
<select id="material">
<option>Acero al carbono</option>
<option>Acero inoxidable</option>
<option>Aluminio</option>
<option>Latón</option>
<option>Cobre</option>
</select>

<h3>Conclusión técnica</h3>
<textarea id="conclusion" placeholder="Explica tu decisión..."></textarea>

<br>

<button onclick="calcularNota()">Obtener nota</button>

<button onclick="copiarExcel()">Copiar fila Excel</button>

<button onclick="descargarCSV()">Descargar registro Excel</button>

<button class="good" onclick="sendToForms()">📤 Enviar al formulario</button>

<h2 id="nota"></h2>

<h3>Informe generado</h3>
<textarea id="informe" readonly></textarea>

</div>

<script>

let state={
 nota:null
};

function calcularNota(){

 let nota=(Math.random()*5+5).toFixed(1);

 state.nota=nota;

 document.getElementById("nota").innerHTML="Nota: "+nota;

 let informe=
 "Alumno: "+document.getElementById("nombre").value+
 "\nGrupo: "+document.getElementById("grupo").value+
 "\nMaterial: "+document.getElementById("material").value+
 "\nNota: "+nota+
 "\n\nConclusión:\n"+document.getElementById("conclusion").value;

 document.getElementById("informe").value=informe;
}

function copiarExcel(){

 if(!state.nota){
  alert("Primero calcula la nota");
  return;
 }

 let fila=
 Date.now()+"\t"+
 new Date().toLocaleDateString()+"\t"+
 document.getElementById("nombre").value+"\t"+
 document.getElementById("grupo").value+"\t"+
 document.getElementById("material").value+"\t"+
 state.nota;

 navigator.clipboard.writeText(fila);

 alert("Fila copiada. Pega en Excel");
}

function descargarCSV(){

 if(!state.nota){
  alert("Primero calcula la nota");
  return;
 }

 let contenido=
 "Nombre;Grupo;Material;Nota\n"+
 document.getElementById("nombre").value+";"+
 document.getElementById("grupo").value+";"+
 document.getElementById("material").value+";"+
 state.nota;

 let blob=new Blob([contenido],{type:"text/csv"});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="registro.csv";
 a.click();
}

function sendToForms(){

 if(!state.nota){
  alert("Primero calcula la nota");
  return;
 }

 const nombre=document.getElementById("nombre").value;
 const grupo=document.getElementById("grupo").value;
 const nota=state.nota;
 const informe=document.getElementById("informe").value;

 const url="https://forms.cloud.microsoft/e/uUkAFjUNtu?origin=lprLink";

 window.open(url,"_blank");

 const texto=
 "Nombre: "+nombre+
 "\nGrupo: "+grupo+
 "\nNota: "+nota+
 "\n\nINFORME:\n"+informe;

 try{
  navigator.clipboard.writeText(texto);
  alert("Formulario abierto ✅\nDatos copiados.\nPega con Ctrl+V");
 }catch(e){
  alert("Formulario abierto.\nCopia manualmente el informe.");
 }
}

</script>

</body>
</html>
